
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUSTPOSE | Premium Photo Gallery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
:root {
  --bg:#080b10;
  --card:#151a22;
  --text:#fff;
  --muted:#9ca3af;
  --accent:#00e99a;
  --border:#29313d;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Segoe UI,Arial,sans-serif;
}
body.light {
  --bg:#f3f5f8;
  --card:#fff;
  --text:#18202b;
  --muted:#64748b;
  --border:#dfe4ea;
}
button,a { -webkit-tap-highlight-color:transparent }
button { cursor:pointer;font-family:inherit }
header {
  padding:65px 18px 25px;
  text-align:center;
  background:radial-gradient(ellipse at top,#123d35 0%,transparent 65%);
}
.logo {
  font-size:clamp(30px,7vw,52px);
  font-weight:900;
  letter-spacing:2px;
}
.logo span { color:var(--accent) }
.subtitle {
  color:var(--muted);
  font-size:11px;
  letter-spacing:4px;
  margin-top:8px;
}
.event {
  display:inline-block;
  margin-top:23px;
  padding:10px 22px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}
.actions {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}
.btn {
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:25px;
  padding:12px 18px;
  font-size:12px;
  font-weight:700;
}
.primary {
  background:var(--accent);
  color:#07120e;
  border-color:var(--accent);
}
.theme {
  position:fixed;
  top:15px;
  right:15px;
  z-index:20;
}
.status {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:12px;
}
.section-head {
  max-width:1100px;
  margin:20px auto 5px;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.section-head h2 { font-size:19px;margin:0 }
.section-head small { color:var(--muted) }
#gallery {
  max-width:1100px;
  margin:auto;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:17px;
}
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s,border-color .2s;
}
.card:hover {
  transform:translateY(-4px);
  border-color:var(--accent);
}
.card img {
  display:block;
  width:100%;
  height:230px;
  object-fit:cover;
}
.card-body { padding:14px }
.card-title { font-size:13px;font-weight:800 }
.card-meta {
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}
.empty {
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:65px 10px;
}
#modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(5,8,13,.98);
  z-index:100;
  flex-direction:column;
}
.modal-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  gap:10px;
}
.modal-title { font-size:13px;font-weight:700 }
.viewer {
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:10px;
}
.viewer img {
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:9px;
}
.nav {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:rgba(0,0,0,.55);
  color:white;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:23px;
}
.prev { left:8px }
.next { right:8px }
.thumbs {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px;
  justify-content:flex-start;
}
.thumbs img {
  width:53px;
  height:53px;
  object-fit:cover;
  border-radius:7px;
  opacity:.5;
  cursor:pointer;
  flex-shrink:0;
}
.thumbs img.active {
  opacity:1;
  outline:2px solid var(--accent);
}
.modal-actions {
  display:flex;
  justify-content:center;
  gap:8px;
  padding:12px 10px 22px;
  flex-wrap:wrap;
}
footer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:35px;
}
@media(max-width:500px) {
  #gallery {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    padding:10px;
  }
  .card img { height:190px }
  .card-body { padding:10px }
  .btn { padding:11px 13px;font-size:11px }
}
</style>
</head>
<body>

<button class="btn theme" onclick="toggleTheme()">☀ / ☾</button>

<header>
  <div class="logo">JUST<span>POSE</span></div>
  <div class="subtitle">PREMIUM PHOTOBOOTH GALLERY</div>
  <div class="event" id="eventName">LOADING EVENT...</div>
  <div class="actions">
    <button class="btn primary" onclick="downloadAll()">⬇ DOWNLOAD ALL</button>
    <button class="btn" onclick="copyGalleryLink()">🔗 COPY LINK</button>
    <button class="btn" onclick="loadGallery()">↻ REFRESH</button>
  </div>
</header>

<div class="status" id="status">Loading photos...</div>

<div class="section-head">
  <h2>Photo Sessions</h2>
  <small>Newest first</small>
</div>

<div id="gallery"></div>

<div id="modal">
  <div class="modal-top">
    <div class="modal-title" id="modalTitle">SESSION</div>
    <button class="btn" onclick="closeModal()">✕ CLOSE</button>
  </div>
  <div class="viewer">
    <button class="nav prev" onclick="movePhoto(-1)">‹</button>
    <img id="viewerImage" alt="Session photo">
    <button class="nav next" onclick="movePhoto(1)">›</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="modal-actions">
    <button class="btn primary" onclick="downloadPhoto()">⬇ PHOTO</button>
    <button class="btn" onclick="downloadSession()">⬇ SESSION ZIP</button>
    <button class="btn" onclick="copyPhotoLink()">🔗 COPY PHOTO LINK</button>
    <button class="btn" onclick="sharePhoto()">SHARE</button>
  </div>
</div>

<footer>© JUSTPOSE PHOTOBOOTH • YOUR MOMENTS, BEAUTIFULLY CAPTURED</footer>

<script>
const params = new URLSearchParams(location.search);
const cloudName = params.get("cloud") || "";
const eventId = params.get("event") || "";

let sessions = [];
let activeSession = null;
let activeIndex = 0;

const gallery = document.getElementById("gallery");
const statusBox = document.getElementById("status");

document.getElementById("eventName").textContent =
  eventId ? "EVENT: " + eventId.toUpperCase() : "EVENT NOT SET";

function toggleTheme() {
  document.body.classList.toggle("light");
}

function notify(message) {
  statusBox.textContent = message;
}

function imageUrl(img, transform = "") {
  const version = img.version ? "v" + img.version + "/" : "";
  const options = transform ? transform + "/" : "";
  const path = img.public_id.split("/").map(encodeURIComponent).join("/");
  return "https://res.cloudinary.com/" +
    encodeURIComponent(cloudName) +
    "/image/upload/" + options + version +
    path + "." + (img.format || "jpg");
}

function photoType(img) {
  const filename = img.public_id.split("/").pop();
  const match = filename.match(/(?:^|_)(Print|Single)(?:_|$)/i);
  return match ? match[1].toLowerCase() : "";
}

function photoNumber(img) {
  const filename = img.public_id.split("/").pop();
  const match = filename.match(/^(\d+)_/);
  return match ? Number(match[1]) : 999;
}

function orderPhotos(a, b) {
  const priority = p => photoType(p) === "print" ? 0 : 1;
  return priority(a) - priority(b) ||
    photoNumber(a) - photoNumber(b) ||
    (a.public_id || "").localeCompare(b.public_id || "");
}

function sessionTime(session) {
  return Math.max(...session.photos.map(p => {
    if (p.created_at) {
      const time = Date.parse(p.created_at);
      if (Number.isFinite(time)) return time;
    }
    return (Number(p.version) || 0) * 1000;
  }));
}

function safeSessionName(name) {
  return name.replace(/[^a-zA-Z0-9_-]/g, "_");
}

async function loadGallery() {
  if (!cloudName || !eventId) {
    notify("Missing event or cloud in QR link.");
    gallery.innerHTML = '<div class="empty">Invalid QR gallery link.</div>';
    return;
  }

  notify("Loading latest photo sessions...");

  try {
    const url = "https://res.cloudinary.com/" +
      encodeURIComponent(cloudName) +
      "/image/list/" + encodeURIComponent(eventId) +
      ".json?t=" + Date.now();

    const response = await fetch(url, {cache:"no-store"});
    if (!response.ok) throw new Error("Cloudinary HTTP " + response.status);

    const data = await response.json();
    const groups = new Map();

    for (const img of data.resources || []) {
      if (!img.public_id) continue;

      const parts = img.public_id.split("/");
      const sessionName = parts.length > 1
        ? parts[parts.length - 2]
        : "SESS_MAIN";

      if (!groups.has(sessionName)) groups.set(sessionName, []);
      groups.get(sessionName).push(img);
    }

    sessions = [...groups.entries()].map(([name, photos]) => ({
      name,
      photos: photos.sort(orderPhotos)
    })).filter(session =>
      session.photos.some(photo => photoType(photo) === "print")
    );

    sessions.sort((a, b) =>
      sessionTime(b) - sessionTime(a) ||
      b.name.localeCompare(a.name, undefined, {numeric:true})
    );

    renderGallery();
    notify(sessions.length + " completed session(s) found.");
  } catch (error) {
    console.error("Gallery load error:", error);
    notify("Unable to load photos. Check Cloudinary public list and event tag.");
    gallery.innerHTML =
      '<div class="empty">Gallery unavailable. Please refresh later.</div>';
  }
}

function renderGallery() {
  gallery.replaceChildren();

  if (!sessions.length) {
    gallery.innerHTML =
      '<div class="empty">No completed sessions yet. Photos will appear after a Print is uploaded.</div>';
    return;
  }

  sessions.forEach((session, index) => {
    const print = session.photos.find(p => photoType(p) === "print");
    const singles = session.photos.filter(p => photoType(p) === "single");

    const card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");

    const cover = document.createElement("img");
    cover.loading = index < 4 ? "eager" : "lazy";
    cover.src = imageUrl(print, "w_500,c_limit");
    cover.alt = "Print photo for " + session.name;

    const body = document.createElement("div");
    body.className = "card-body";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = session.name.replace(/^SESS_/, "SESSION ");

    const meta = document.createElement("div");
    meta.className = "card-meta";
    meta.textContent = "1 PRINT • " + singles.length + " SINGLE(S)" +
      (index === 0 ? " • LATEST" : "");

    body.append(title, meta);
    card.append(cover, body);

    card.onclick = () => openSession(index);
    card.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openSession(index);
      }
    };

    gallery.appendChild(card);
  });
}

function openSession(index) {
  activeSession = sessions[index];
  activeIndex = 0;
  document.getElementById("modal").style.display = "flex";
  document.body.style.overflow = "hidden";
  renderPhoto();
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "";
  activeSession = null;
}

function renderPhoto() {
  if (!activeSession) return;

  const photos = activeSession.photos;
  const photo = photos[activeIndex];

  document.getElementById("modalTitle").textContent =
    activeSession.name + " • " +
    (photoType(photo) === "print" ? "PRINT" : "SINGLE") +
    " • " + (activeIndex + 1) + "/" + photos.length;

  document.getElementById("viewerImage").src = imageUrl(photo);

  const strip = document.getElementById("thumbs");
  strip.replaceChildren();

  photos.forEach((p, index) => {
    const thumb = document.createElement("img");
    thumb.src = imageUrl(p, "w_120,c_limit");
    thumb.alt = "Photo " + (index + 1);
    thumb.className = index === activeIndex ? "active" : "";
    thumb.onclick = () => {
      activeIndex = index;
      renderPhoto();
    };
    strip.appendChild(thumb);
  });

  strip.querySelector(".active")?.scrollIntoView({
    block:"nearest",
    inline:"nearest"
  });
}

function movePhoto(direction) {
  if (!activeSession) return;
  activeIndex = (activeIndex + direction +
    activeSession.photos.length) % activeSession.photos.length;
  renderPhoto();
}

document.addEventListener("keydown", event => {
  if (!activeSession) return;
  if (event.key === "Escape") closeModal();
  if (event.key === "ArrowRight") movePhoto(1);
  if (event.key === "ArrowLeft") movePhoto(-1);
});

let touchStartX = 0;
document.getElementById("viewerImage").addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive:true});

document.getElementById("viewerImage").addEventListener("touchend", e => {
  const difference = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(difference) > 50) movePhoto(difference < 0 ? 1 : -1);
}, {passive:true});

function activePhoto() {
  return activeSession?.photos[activeIndex];
}

function downloadPhoto() {
  const photo = activePhoto();
  if (!photo) return;
  const link = document.createElement("a");
  link.href = imageUrl(photo, "fl_attachment");
  link.download = photo.public_id.split("/").pop() + "." + (photo.format || "jpg");
  document.body.appendChild(link);
  link.click();
  link.remove();
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    notify("Link copied!");
  } catch {
    notify("Unable to copy link.");
  }
}

function copyGalleryLink() {
  copyText(location.href);
}

function copyPhotoLink() {
  const photo = activePhoto();
  if (photo) copyText(imageUrl(photo));
}

function sharePhoto() {
  const photo = activePhoto();
  if (!photo) return;
  const url = imageUrl(photo);
  if (navigator.share) {
    navigator.share({title:"Justpose Photo",url}).catch(() => {});
  } else {
    window.open(
      "https://www.facebook.com/sharer/sharer.php?u=" +
      encodeURIComponent(url),
      "_blank",
      "noopener,noreferrer"
    );
  }
}

async function makeZip(items, filename) {
  if (typeof JSZip === "undefined" || typeof saveAs === "undefined") {
    notify("ZIP tools unavailable. Please check internet connection.");
    return;
  }

  notify("Preparing ZIP download...");
  const zip = new JSZip();
  let success = 0;

  for (const item of items) {
    try {
      const response = await fetch(imageUrl(item.photo));
      if (!response.ok) throw new Error("Image download failed");

      zip.file(item.path, await response.blob());
      success++;
    } catch (error) {
      console.error("ZIP item failed:", item.path, error);
    }
  }

  if (!success) {
    notify("Download failed. Check Cloudinary image access.");
    return;
  }

  const blob = await zip.generateAsync({type:"blob"});
  saveAs(blob, filename);
  notify("ZIP ready: " + success + " photo(s).");
}

function downloadSession() {
  if (!activeSession) return;
  const name = safeSessionName(activeSession.name);
  makeZip(
    activeSession.photos.map((photo, i) => ({
      photo,
      path: (i === 0 ? "PRINT" : "SINGLE_" + i) +
        "." + (photo.format || "jpg")
    })),
    name + ".zip"
  );
}

function downloadAll() {
  const items = sessions.flatMap(session =>
    session.photos.map((photo, i) => ({
      photo,
      path: safeSessionName(session.name) + "/" +
        (i === 0 ? "PRINT" : "SINGLE_" + i) +
        "." + (photo.format || "jpg")
    }))
  );

  if (!items.length) {
    notify("No completed sessions available.");
    return;
  }

  makeZip(items, "JUSTPOSE_GALLERY.zip");
}

loadGallery();

setInterval(() => {
  if (!activeSession) loadGallery();
}, 30000);
</script>
</body>
</html>
